[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "habits-cli"
version = "0.1.0"
description = "CLI local para crear, planificar y seguir hábitos"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["habits*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[project.scripts]
habit = "habits.cli:app"

